# 生产环境：全部敏感配置来自环境变量，关闭接口文档
spring:
  datasource:
    url: ${SMARTEN_DB_URL}
    username: ${SMARTEN_DB_USERNAME}
    password: ${SMARTEN_DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 10000

smarten:
  jwt:
    secret: ${SMARTEN_JWT_SECRET}
  cors:
    allowed-origins: ${SMARTEN_CORS_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: warn
    com.smarten: info
