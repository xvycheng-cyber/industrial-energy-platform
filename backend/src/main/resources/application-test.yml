# 测试环境：独立库 smarten_energy_test，启动时初始化结构 + 种子数据（幂等），不打印 SQL
# 注意：集成测试需要本机 MySQL 8 可连接，且已创建 smarten_energy_test 库
spring:
  datasource:
    url: "${SMARTEN_TEST_DB_URL:jdbc:mysql://localhost:3306/smarten_energy_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}"
    username: ${SMARTEN_DB_USERNAME:root}
    password: ${SMARTEN_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.smarten: info

smarten:
  simulator:
    enabled: false
