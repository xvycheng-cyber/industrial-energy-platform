server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful

spring:
  application:
    name: smarten-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${SMARTEN_DB_URL:jdbc:mysql://localhost:3306/smarten_energy?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}"
    username: ${SMARTEN_DB_USERNAME:root}
    password: ${SMARTEN_DB_PASSWORD:}
    hikari:
      pool-name: SmartenHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true

smarten:
  version: 1.0.0
  jwt:
    # 生产环境必须通过环境变量覆盖；默认值仅用于本地开发
    secret: ${SMARTEN_JWT_SECRET:smarten-dev-only-secret-please-change-0123456789}
    access-expire-minutes: 120
    refresh-expire-days: 7
  cors:
    allowed-origins: ${SMARTEN_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: smarten-backend
    version: 1.0.0

logging:
  level:
    root: info
    com.smarten: info
